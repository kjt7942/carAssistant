<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ui-build" content="__UI_BUILD__">
<meta name="min-native" content="2">
<title>차량 비서</title>
<style>
/* 차량 화면(1280x720 가정) 야간 운전용 단일 다크 룩. 좌: 시계·날짜 / 우: 날씨 / 하단: 상태·버튼. 그림자·블러·상시 애니메이션 없음 */
:root{
  color-scheme:dark;
  --bg:#05070a; --fg:#c9d1d8; --fg-dim:#7b8791; --line:#182027; --panel:#0c1117;
  --accent:#74b6c6; --good:#58b883; --bad:#d9776c; --warn:#c79a4e;
  --f-disp:"Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --f-body:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic",sans-serif;
}
html[data-dim="1"]{--fg:#e8eef2;--fg-dim:#99a5af;--accent:#93d3e3;--warn:#dfb062;--line:#222c34}
html[data-dim="3"]{--fg:#8a959e;--fg-dim:#56616a;--accent:#4d8997;--warn:#8f7140;--line:#11171c}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding:12px 16px;-webkit-user-select:none;user-select:none}
.stage{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}
.main{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;justify-content:center;align-content:center;min-height:0}
.time,.wx{display:contents}
.clock{display:flex;align-items:baseline;gap:.18em;font-family:var(--f-disp);font-weight:600;line-height:.9;
  font-size:min(36vh,17vw);font-variant-numeric:tabular-nums;white-space:nowrap}
.ampm{font-family:var(--f-body);font-weight:500;font-size:.2em;color:var(--fg-dim)}
.date{display:flex;align-items:baseline;justify-content:center;text-align:center;flex-wrap:wrap;column-gap:.5em;font-size:min(8.5vh,4.6vw);line-height:1.2}
.dow{color:var(--accent);font-weight:700}
.dt{font-weight:500}
.clock{grid-column:1;grid-row:1;align-self:center;padding-right:2.2vw}
.date{grid-column:1;grid-row:2;align-self:start;margin:2vh 2.2vw 0 0}
.wx-top{grid-column:2;grid-row:1;align-self:center;padding-left:2.2vw;border-left:1px solid var(--line)}
.wx-info{grid-column:2;grid-row:2;align-self:start;padding:2vh 0 0 2.2vw;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1.6vh}
.wx>.empty{grid-column:2;grid-row:1 / span 2;align-self:center;padding-left:2.2vw;border-left:1px solid var(--line)}
.wx-top{display:flex;align-items:center;gap:2vw;min-width:0}
.wx-ico{width:min(17vh,9vw);height:min(17vh,9vw);color:var(--accent);flex:none}
.wx-ico svg{width:100%;height:100%;display:block}
.temp{font-family:var(--f-disp);font-weight:600;font-size:min(24vh,13vw);line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
.temp small{font-size:.5em;color:var(--fg-dim);font-weight:500}
.cond{font-size:min(6.5vh,3.6vw);font-weight:500;text-align:right}
.stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:1.2vh 2.2vw;font-size:min(5vh,2.8vw);color:var(--fg-dim)}
.stats b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.place{font-size:min(4vh,2.4vw);color:var(--fg-dim);text-align:right}
.empty{color:var(--fg-dim);font-size:min(5vh,2.8vw);line-height:1.5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px}
.status{font-size:min(3.8vh,2.3vw);color:var(--fg-dim);min-width:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.stale{color:var(--warn)}
.btns{display:flex;gap:12px;flex:none;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:22px;font-weight:500;color:var(--fg-dim);background:transparent;border:1px solid var(--line);
  border-radius:12px;min-width:110px;min-height:76px;padding:0 18px}
button:active{background:var(--line)}
button.main-btn{color:#031318;background:var(--accent);border-color:var(--accent);font-weight:700;min-width:170px}
button.main-btn:active{background:var(--fg-dim)}
.ov{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;z-index:5}
.ov-in{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:2.2vh}
.ov-state{color:var(--accent);font-size:min(5vh,3vw);font-weight:700}
.ov-text{font-size:min(8vh,4.4vw);font-weight:500;line-height:1.3;min-height:1.3em}
.ov-resp{font-size:min(6vh,3.4vw);color:var(--fg-dim);line-height:1.4}
.dg-row{display:grid;grid-template-columns:minmax(120px,26%) auto minmax(0,1fr);gap:4px 14px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:min(3.6vh,2.2vw)}
.dg-row .k{color:var(--fg-dim)}
.pill{display:inline-block;min-width:3.4em;text-align:center;padding:0 10px;border-radius:999px;font-size:.8em;font-weight:700}
.p-ok{background:rgba(88,184,131,.18);color:var(--good)}
.p-no{background:rgba(217,119,108,.18);color:var(--bad)}
.p-info{background:var(--line);color:var(--fg-dim)}
.dg-list{overflow:auto;max-height:68vh}
#dg .ov-in{gap:1.2vh}
#dg .ov-state{font-size:min(4.4vh,2.8vw)}
#dg .dg-row{padding:3px 0;font-size:min(3.7vh,2.3vw)}
#dg .dg-list{max-height:72vh}
#dg button{font-size:min(3.6vh,2.4vw);min-height:0;padding:1.4vh 14px}
#dg .ov-in{max-width:1100px}
.pl-list{overflow:auto;max-height:62vh}
.ap-row{padding:1.1vh 4px;border-bottom:1px solid var(--line);font-size:max(14px,min(3.4vh,2.1vw))}
.ap-row:active{background:var(--line)}
.ap-row small{display:block;color:var(--fg-dim);font-size:.72em}
.kk-row{display:grid;grid-template-columns:4.2em 1fr auto;gap:4px 12px;padding:.8vh 0;border-bottom:1px solid var(--line);font-size:max(14px,min(3.4vh,2.1vw))}
.kk-row small{color:var(--fg-dim)}
.ap-row .rk{color:var(--accent);font-weight:700;margin-right:.6em}
.ap-row.cur{border-left:3px solid var(--accent);padding-left:10px}
.ap-row .mini{float:right;font-size:.8em;min-width:0;min-height:0;padding:.5vh 12px;margin-left:8px}
input.ak-in{font:inherit;font-size:max(16px,min(3.6vh,2.4vw));color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.4vh 14px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.upd{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;background:var(--line);color:var(--fg);font-size:18px;z-index:5}
.upd[hidden]{display:none}
@media (orientation:portrait){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;justify-content:stretch;align-content:center}
  .clock{grid-column:1;grid-row:1;justify-self:center;padding-right:0}
  .date{grid-column:1;grid-row:2;justify-self:center;margin:1vh 0 0}
  .clock{font-size:min(24vh,27vw)}
  .date{font-size:min(5.6vh,6.2vw)}
  .wx-top{grid-column:1;grid-row:3;border-left:0;border-top:1px solid var(--line);padding:2.5vh 0 0;margin-top:2.5vh}
  .wx-info{grid-column:1;grid-row:4;border-left:0;padding:1.4vh 0 0;gap:1.4vh}
  .wx>.empty{grid-column:1;grid-row:3 / span 2;border-left:0;border-top:1px solid var(--line);padding:2.5vh 0 0;margin-top:2.5vh}
  .wx-ico{width:min(11vh,14vw);height:min(11vh,14vw)}
  .temp{font-size:min(15vh,19vw)}
  .cond{font-size:min(4.6vh,5.2vw)}
  .stats{font-size:min(3.9vh,4.4vw)}
  .place{font-size:min(3.2vh,3.6vw)}
  .status{font-size:min(3vh,3.4vw)}
  .bar{flex-direction:column;align-items:stretch;gap:10px}
  .btns{flex-wrap:nowrap;justify-content:stretch;gap:8px}
  button{min-width:0;flex:1 1 0;font-size:17px;padding:0 4px}
  button.main-btn{flex:1.5 1 0;min-width:0}
}

/* 세로 화면: 오버레이 글자는 폭(vw) 기준, 위쪽부터 배치 */
@media (orientation:portrait){
  .pl-list{max-height:68vh}
  .ap-row,.kk-row{font-size:max(14px,3.6vw)}
  .ov{align-items:flex-start;padding:max(24px,4vh) 18px 24px}
  .ov-in{gap:2vh}
  .ov-state{font-size:max(17px,4.6vw)}
  .ov-text{font-size:max(22px,7.2vw)}
  .ov-resp{font-size:max(17px,4.8vw)}
  #dg .ov-state{font-size:max(17px,4.8vw)}
  #dg .dg-row{grid-template-columns:minmax(0,30%) auto minmax(0,1fr);font-size:max(14px,3.6vw);padding:6px 0}
  #dg .dg-list{max-height:none;overflow:visible}
  #dg .btns{flex-wrap:wrap;justify-content:stretch}
  #dg button{flex:1 1 40%;font-size:max(15px,3.8vw);padding:1.8vh 8px}
  .upd{font-size:max(15px,3.6vw);flex-wrap:wrap}
}
/* 가로 화면이 낮을 때(휴대폰 가로 등) */
@media (orientation:landscape) and (max-height:520px){
  body{padding:6px 12px}
  .bar{min-height:0}
  button{min-height:46px;font-size:16px;min-width:90px;padding:0 12px}
  button.main-btn{min-width:130px}
  .ov{padding:10px 18px}
  #dg .dg-row{font-size:max(13px,3.6vh);padding:2px 0}
  #dg .ov-state{font-size:max(15px,4.4vh)}
  #dg button{font-size:max(14px,3.8vh);min-height:0;padding:1vh 12px}
  #dg .dg-list{max-height:66vh}
  .ov-state{font-size:max(15px,5vh)}
  .ov-text{font-size:max(20px,8vh)}
  .ov-resp{font-size:max(16px,6vh)}
}

/* 음성 명령: 메인 화면(시계·날씨)을 그대로 두고 아래쪽에 작은 박스로 표시 */
#ov{background:rgba(5,7,10,.45);align-items:flex-end;justify-content:center;padding:0 16px max(14px,3.5vh);overflow:visible}
#ov .ov-in{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:max(14px,2.4vh) max(18px,2.4vw);gap:1.2vh;max-width:900px}
#ov .ov-state{font-size:max(15px,min(3.6vh,2.4vw))}
#ov .ov-text{font-size:max(20px,min(5.4vh,3.4vw))}
#ov .ov-resp{font-size:max(16px,min(4vh,2.6vw))}
#ov .ov-text:empty,#ov .ov-resp:empty{display:none}
#ov button{min-height:0;padding:1.2vh 22px;font-size:max(15px,min(3.2vh,2.2vw))}
@media (orientation:portrait){
  #ov{align-items:flex-end;padding:0 12px max(14px,3vh)}
  #ov .ov-in{padding:16px 18px;gap:1.2vh}
  #ov .ov-state{font-size:max(15px,4vw)}
  #ov .ov-text{font-size:max(20px,6vw)}
  #ov .ov-resp{font-size:max(16px,4.2vw)}
  #ov button{font-size:max(15px,3.8vw)}
}
@media (orientation:landscape) and (max-height:520px){
  #ov{padding-bottom:8px}
  #ov .ov-in{padding:8px 16px;gap:.6vh}
  #ov .ov-state{font-size:max(14px,4vh)}
  #ov .ov-text{font-size:max(18px,6.4vh)}
  #ov .ov-resp{font-size:max(15px,4.6vh)}
  #ov button{font-size:max(14px,4vh)}
}

/* 음성 박스: 닫기 버튼은 오른쪽 끝에 크게 */
#ov .ov-in{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:2vw;row-gap:1vh;align-items:center}
#ov .ov-state,#ov .ov-text,#ov .ov-resp{grid-column:1}
#ov .btns{grid-column:2;grid-row:1 / span 3;align-self:stretch;justify-content:flex-end;display:flex}
#ov #ovClose{min-width:max(130px,17vw);min-height:max(76px,13vh);height:100%;font-size:max(20px,min(4.2vh,2.8vw));font-weight:700;padding:0 20px;color:var(--fg);border-color:var(--fg-dim)}
@media (orientation:portrait){
  #ov #ovClose{min-width:max(90px,24vw);min-height:max(68px,9vh);font-size:max(18px,4.6vw)}
}
@media (orientation:landscape) and (max-height:520px){
  #ov #ovClose{min-height:max(56px,16vh);min-width:max(110px,15vw);font-size:max(17px,5vh)}
}

/* 터치 조작: 모든 버튼과 목록 줄은 손가락으로 누르기 쉬운 최소 크기를 보장 */
:root{--tap:60px}
@media (orientation:portrait){:root{--tap:58px}}
@media (orientation:landscape) and (max-height:520px){:root{--tap:52px}}
button,#dg button,#ov button,#ak button,#ap button,#kk button,#md button{min-height:var(--tap);min-width:max(96px,8vw)}
#ov #ovClose{min-height:max(var(--tap),13vh)}
.btns{gap:12px}
.ap-row,.kk-row{min-height:var(--tap);box-sizing:border-box;padding-top:max(10px,1.4vh);padding-bottom:max(10px,1.4vh)}
@media (orientation:portrait){.bar button{min-width:72px}.bar button.main-btn{min-width:110px}}
.ap-row .mini{min-height:44px;min-width:76px;padding:0 16px}
#dg .dg-row{min-height:0}
</style>
</head>
<body>
<main class="stage">
  <div class="main">
    <section class="time" aria-label="시계와 날짜">
      <div class="clock"><span class="ampm" id="ampm"></span><span id="hm">--:--</span></div>
      <div class="date"><span class="dt" id="dt"></span><span class="dow" id="dow"></span></div>
    </section>
    <section class="wx" id="wx" aria-label="날씨"><div class="empty">날씨를 불러오는 중입니다.</div></section>
  </div>
  <div class="bar">
    <div class="status" id="status"></div>
    <div class="btns">
      <button id="bVoice" class="main-btn" type="button">음성 명령</button>
      <button id="bDiag" type="button">진단</button>
      <button id="bFmt" type="button">24시간</button>
      <button id="bDim" type="button">밝기 자동</button>
    </div>
  </div>
</main>

<div class="ov" id="ov" hidden>
  <div class="ov-in">
    <div class="ov-state" id="ovState"></div>
    <div class="ov-text" id="ovText"></div>
    <div class="ov-resp" id="ovResp"></div>
    <div class="btns"><button id="ovClose" type="button">닫기</button></div>
  </div>
</div>

<div class="upd" id="upd" hidden><span id="updTxt"></span><button id="updBtn" type="button" hidden>지금 설치</button></div>

<div class="ov" id="ak" hidden>
  <div class="ov-in">
    <div class="ov-state">AI 연결 — 오픈라우터 키</div>
    <div class="ov-resp" id="akMsg"></div>
    <input class="ak-in" id="akIn" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-or-v1-…">
    <div class="btns" style="justify-content:flex-start">
      <button id="akSave" type="button" class="main-btn">저장</button>
      <button id="akClear" type="button">키 삭제</button>
      <button id="akClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="ov" id="ap" hidden>
  <div class="ov-in">
    <div class="ov-state" id="apTitle">설치된 앱 — 누르면 실행</div>
    <div class="pl-list" id="apList"></div>
    <div class="btns" style="justify-content:flex-start">
      <button id="apFilter" type="button">차량 관련만</button>
      <button id="apClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="ov" id="kk" hidden>
  <div class="ov-in">
    <div class="ov-state">버튼 점검 — 핸들 리모컨이나 차량 버튼을 눌러 보세요</div>
    <div class="ov-resp" id="kkDev"></div>
    <div class="pl-list" id="kkList"><div class="ov-resp">아직 입력이 없습니다.</div></div>
    <div class="btns" style="justify-content:flex-start">
      <button id="kkClear" type="button">기록 지우기</button>
      <button id="kkClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="ov" id="md" hidden>
  <div class="ov-in">
    <div class="ov-state" id="mdTitle">AI 모델 선택 — 무료 모델</div>
    <div class="ov-resp" id="mdMsg"></div>
    <div class="pl-list" id="mdList"></div>
    <div class="btns" style="justify-content:flex-start">
      <button id="mdDefault" type="button">기본값으로</button>
      <button id="mdReload" type="button">목록 새로고침</button>
      <button id="mdClose" type="button">닫기</button>
    </div>
  </div>
</div>

<div class="ov" id="dg" hidden>
  <div class="ov-in">
    <div class="ov-state">진단 — 이 기기에서 쓸 수 있는 기능</div>
    <div class="dg-list" id="dgList"></div>
    <div class="btns" style="justify-content:flex-start">
      <button id="dgPerm" type="button">권한 다시 요청</button>
      <button id="dgAi" type="button">AI 키 설정</button>
      <button id="dgModels" type="button">AI 모델</button>
      <button id="dgApps" type="button">앱 목록</button>
      <button id="dgKeys" type="button">버튼 점검</button>
      <button id="dgUpd" type="button">업데이트 확인</button>
      <button id="dgRefresh" type="button">새로 확인</button>
      <button id="dgClose" type="button">닫기</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var A=window.Android||null;
  var DOW=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  function pad(n){return n<10?'0'+n:''+n}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function num(v){return typeof v==='number'&&isFinite(v)}

  /* ---------- 시계 (한국 시간 고정) ---------- */
  var fmt=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',weekday:'short',hourCycle:'h23'});
  function seoulNow(){
    var p={};fmt.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
    return {mo:+p.month,d:+p.day,h:+p.hour,mi:+p.minute,wk:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[p.weekday]};
  }
  var use24=store.get('clk24')!=='0';
  var dimMode=store.get('dim')||'auto';
  var DIMS=['auto','1','2','3'],DIMLABEL={auto:'밝기 자동','1':'밝기 밝게','2':'밝기 보통','3':'밝기 어둡게'};
  if(DIMS.indexOf(dimMode)<0)dimMode='auto';
  function applyDim(hour){
    var lv=dimMode;
    if(dimMode==='auto')lv=(hour>=7&&hour<18)?'1':((hour>=18&&hour<21)||(hour>=5&&hour<7))?'2':'3';
    document.documentElement.setAttribute('data-dim',lv);
    $('bDim').textContent=DIMLABEL[dimMode];
  }
  function drawClock(){
    var t=seoulNow(),h=t.h,ap='';
    if(!use24){ap=h<12?'오전':'오후';h=h%12;if(h===0)h=12}else{h=pad(h)}
    $('ampm').textContent=ap;
    $('hm').textContent=h+':'+pad(t.mi);
    $('dt').textContent=t.mo+'월 '+t.d+'일';
    $('dow').textContent=DOW[t.wk];
    $('bFmt').textContent=use24?'24시간':'12시간';
    applyDim(t.h);drawStatus();

    if(code===3)return{c:'흐림',i:'cloudy'};
    if(code===45||code===48)return{c:'안개',i:'fog'};
    if(code>=51&&code<=57)return{c:'이슬비',i:'rain'};
    if(code>=61&&code<=67)return{c:'비',i:'rain'};
    if(code>=71&&code<=77)return{c:'눈',i:'snow'};

  }
  $('dgAi').addEventListener('click',function(){
    if(!A||!A.hasApiKey){$('dg').hidden=true;ovShow('앱을 업데이트해 주세요','','AI 키 입력은 최신 앱에서 가능합니다. "업데이트 확인"을 눌러 주세요.');return}
    $('dg').hidden=true;$('akIn').value='';akRefresh();$('ak').hidden=false;
  });
  $('akSave').addEventListener('click',function(){
    var ok=false;try{ok=A.setApiKey($('akIn').value)}catch(e){}
    if(ok){$('akIn').value='';akRefresh('저장했습니다. 이제 정해진 명령이 아닌 말도 AI가 답합니다.')}
    else akRefresh('키 형식이 올바르지 않습니다. sk-or- 로 시작하는 키를 입력해 주세요.');
  });
  $('akClear').addEventListener('click',function(){try{A.clearApiKey()}catch(e){}akRefresh('키를 삭제했습니다.')});
  $('akClose').addEventListener('click',function(){$('ak').hidden=true});
  /* ---------- 앱 목록 / 버튼 점검 ---------- */
  var apps=[],apOnlyCar=true;
  var CAR_RE=/radio|fm|am\b|music|player|media|bluetooth|bt|steer|wheel|key|can|auto|car|navi|dvr|av|phone|dial|syu|microntek|ts10|px|fyt|hct|setting|라디오|음악|블루투스|미디어|전화|내비|설정/i;
  function apDraw(){
    var list=apps.filter(function(a){return !apOnlyCar||CAR_RE.test(a.n)||CAR_RE.test(a.p)});
    $('apTitle').textContent='설치된 앱 '+list.length+'/'+apps.length+'개 — 누르면 실행';
    $('apFilter').textContent=apOnlyCar?'전체 보기':'차량 관련만';
    var h='';list.forEach(function(a,i){h+='<div class="ap-row" data-p="'+esc(a.p)+'">'+esc(a.n)+'<small>'+esc(a.p)+'</small></div>'});
    $('apList').innerHTML=h||'<div class="ov-resp">표시할 앱이 없습니다.</div>';
  }
  $('dgApps').addEventListener('click',function(){
    if(!A||!A.listApps){$('dg').hidden=true;ovShow('앱을 업데이트해 주세요','','이 점검은 최신 앱에서 가능합니다. "업데이트 확인"을 눌러 주세요.');return}
    try{apps=JSON.parse(A.listApps())}catch(e){apps=[]}
    apOnlyCar=true;$('dg').hidden=true;apDraw();$('ap').hidden=false;
  });
  $('apFilter').addEventListener('click',function(){apOnlyCar=!apOnlyCar;apDraw()});
  $('apList').addEventListener('click',function(ev){
    var r=ev.target.closest('.ap-row');if(!r)return;
    var ok=false;try{ok=A.launchApp(r.getAttribute('data-p'))}catch(e){}
    $('apTitle').textContent=(ok?'실행 요청함: ':'실행 실패: ')+r.firstChild.textContent;
  });
  $('apClose').addEventListener('click',function(){$('ap').hidden=true});

  var kkLog=[];
  function kkDraw(){
    var h='';kkLog.forEach(function(k){
      h+='<div class="kk-row"><b>'+esc(k.action)+'</b><div>'+esc(k.name)+' <small>코드 '+k.code+(k.scan?' · 스캔 '+k.scan:'')+'</small></div><small>'+esc(k.src==='media'?'미디어 버튼':'키')+' · '+esc(k.dev)+'</small></div>';
    });
    $('kkList').innerHTML=h||'<div class="ov-resp">아직 입력이 없습니다.</div>';
  }
  window.onNativeKey=function(k){kkLog.unshift(k);if(kkLog.length>14)kkLog.pop();if(!$('kk').hidden)kkDraw()};
  $('dgKeys').addEventListener('click',function(){
    if(!A||!A.setKeyProbe){$('dg').hidden=true;ovShow('앱을 업데이트해 주세요','','이 점검은 최신 앱에서 가능합니다. "업데이트 확인"을 눌러 주세요.');return}
    var devs=[];try{devs=JSON.parse(A.inputDevices())}catch(e){}
    $('kkDev').textContent='입력 장치: '+(devs.length?devs.map(function(d){return d.n+'('+d.k+')'}).join(', '):'정보 없음');
    kkLog=[];kkDraw();A.setKeyProbe(true);$('dg').hidden=true;$('kk').hidden=false;
  });
  $('kkClear').addEventListener('click',function(){kkLog=[];kkDraw()});
  $('kkClose').addEventListener('click',function(){try{A.setKeyProbe(false)}catch(e){}$('kk').hidden=true});
  /* ---------- AI 모델 선택 (무료 모델 목록) ---------- */
  var mdList=[],mdMode='slots',mdSlot=0,mdLoaded=false;
  function mdInfo(id){for(var i=0;i<mdList.length;i++)if(mdList[i].id===id)return mdList[i];return {id:id,name:id}}
  function mdDrawSlots(){
    mdMode='slots';$('mdTitle').textContent='AI 모델 선택 — 무료 모델';
    var cur=chosenModels(),h='';
    cur.forEach(function(id,i){
      var m=mdInfo(id);
      h+='<div class="ap-row" data-i="'+i+'"><button class="mini" type="button" data-t="'+i+'">시험</button><span class="rk">'+(i+1)+'순위</span>'+esc(m.name)+'<small>'+esc(id)+(m.ctx?' · 문맥 '+Math.round(m.ctx/1000)+'K':'')+'</small></div>';
    });
    h+='<div class="ap-row"><small>1순위가 실패하면 2순위, 3순위, 마지막으로 자동 선택 무료 모델(openrouter/free)을 씁니다. 줄을 누르면 모델을 바꿀 수 있고, "시험"은 그 모델로 짧게 한 번 물어봅니다.</small></div>';
    $('mdList').innerHTML=h;
  }
  function mdDrawPick(){
    mdMode='pick';$('mdTitle').textContent=(mdSlot+1)+'순위 모델 고르기 — '+mdList.length+'개';
    var cur=chosenModels()[mdSlot],h='';
    mdList.forEach(function(m){
      h+='<div class="ap-row'+(m.id===cur?' cur':'')+'" data-id="'+esc(m.id)+'">'+esc(m.name)+'<small>'+esc(m.id)+(m.ctx?' · 문맥 '+Math.round(m.ctx/1000)+'K':'')+(m.tools?' · 도구 지원':'')+'</small></div>';
    });
    $('mdList').innerHTML=h||'<div class="ov-resp">모델 목록이 비어 있습니다.</div>';
  }
  function mdLoad(force){
    if(mdLoaded&&!force)return Promise.resolve();
    $('mdMsg').textContent='무료 모델 목록을 불러오는 중…';
    return fetch('https://openrouter.ai/api/v1/models').then(function(r){return r.json()}).then(function(j){
      var arr=(j.data||[]).filter(function(m){
        var o=(m.architecture&&m.architecture.output_modalities)||['text'];
        return /:free$/.test(m.id)&&o.indexOf('text')>=0&&o.length===1;
      }).map(function(m){return {id:m.id,name:m.name||m.id,ctx:m.context_length||0,tools:(m.supported_parameters||[]).indexOf('tools')>=0}});
      arr.sort(function(a,b){return b.ctx-a.ctx||(a.id<b.id?-1:1)});
      arr.unshift({id:'openrouter/free',name:'자동 선택 (무료 모델 중 가능한 것)',ctx:0,tools:false});
      mdList=arr;mdLoaded=true;$('mdMsg').textContent='무료 모델 '+(arr.length-1)+'개를 불러왔습니다.';
    }).catch(function(){
      mdLoaded=false;$('mdMsg').textContent='목록을 불러오지 못했습니다 (인터넷 확인). 지금 선택된 모델은 그대로 쓸 수 있습니다.';
    });
  }
  $('dgModels').addEventListener('click',function(){
    $('dg').hidden=true;$('md').hidden=false;mdDrawSlots();mdLoad(false).then(function(){if(mdMode==='slots')mdDrawSlots()});
  });
  $('mdList').addEventListener('click',function(ev){
    var t=ev.target.closest('[data-t]');
    if(t){
      var i=+t.getAttribute('data-t'),model=chosenModels()[i];
      if(!A||!A.ask||!A.hasApiKey||!A.hasApiKey()){$('mdMsg').textContent='시험하려면 먼저 AI 키를 저장해야 합니다.';return}
      aiTest={slot:i+1,t:Date.now()};$('mdMsg').textContent=(i+1)+'순위 시험 중… (최대 40초)';
      A.ask(JSON.stringify([model]),JSON.stringify([{role:'system',content:'한국어로 한 문장으로만 답한다.'},{role:'user',content:'안녕, 간단히 자기소개해 줘.'}]));
      return;
    }
    var r=ev.target.closest('.ap-row');if(!r)return;
    if(mdMode==='slots'){
      var si=r.getAttribute('data-i');if(si===null)return;
      mdSlot=+si;mdLoad(false).then(function(){mdDrawPick()});
    }else{
      var id=r.getAttribute('data-id');if(!id)return;
      var cur=chosenModels();cur[mdSlot]=id;store.set('aiModels',JSON.stringify(cur));
      $('mdMsg').textContent=(mdSlot+1)+'순위를 바꿨습니다.';mdDrawSlots();
    }
  });
  $('mdDefault').addEventListener('click',function(){store.set('aiModels',JSON.stringify(DEFAULT_MODELS));$('mdMsg').textContent='기본값으로 되돌렸습니다.';mdDrawSlots()});
  $('mdReload').addEventListener('click',function(){mdLoad(true).then(function(){if(mdMode==='pick')mdDrawPick();else mdDrawSlots()})});
  $('mdClose').addEventListener('click',function(){
    if(mdMode==='pick'){mdDrawSlots();return}
    $('md').hidden=true;
  });
  $('dgUpd').addEventListener('click',function(){if(A){A.checkUpdate();$('dg').hidden=true}});
  $('dgClose').addEventListener('click',function(){$('dg').hidden=true});

  /* ---------- 앱 업데이트 알림 ---------- */
  var updHide=null;
  function updShow(txt,btn,ms){
    clearTimeout(updHide);$('updTxt').textContent=txt;$('updBtn').hidden=!btn;$('upd').hidden=false;
    if(ms)updHide=setTimeout(function(){$('upd').hidden=true},ms);
  }
  window.onNativeUpdate=function(e){
    if(e.state==='downloading')updShow('새 버전 내려받는 중 '+(e.msg||''),false);
    else if(e.state==='ready'){updShow('새 버전이 준비되었습니다',true)}
    else if(e.state==='installing')updShow(e.msg,false,15000);
    else if(e.state==='needPermission')updShow(e.msg,true);
    else if(e.state==='done')updShow('업데이트 완료',false,5000);
    else if(e.state==='none')updShow(e.msg,false,4000);
    else if(e.state==='error')updShow(e.msg,false,8000);
  };
  $('updBtn').addEventListener('click',function(){if(A)A.installUpdate()});

  /* ---------- 시작 ---------- */
  drawClock();tick();drawWx();
  if(A){try{A.startLocation()}catch(e){}}
  setTimeout(function(){maybeFetch(false)},6000);
  setInterval(function(){maybeFetch(false);drawStatus()},60000);
  if(A){try{A.uiOk()}catch(e){}}
})();
</script>
</body>
</html>
