name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: carAssistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk carAssistant.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest carAssistant.apk \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "carAssistant 최신 빌드" \
            --notes "자동 빌드된 디버그 APK (commit ${GITHUB_SHA::7})"
