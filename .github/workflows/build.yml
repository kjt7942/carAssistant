name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: carassistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/carAssistant.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/carAssistant.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 / KEYSTORE_PASSWORD 비밀값이 없어 임시 키로 서명합니다. 이 APK는 자동 업데이트 대상이 아닙니다."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Stamp UI build number
        run: sed -i "s/__UI_BUILD__/${{ github.run_number }}/" app/src/main/assets/index.html

      # v20 이하 앱은 500KB보다 작은 설치 파일을 '올바르지 않다'며 거부한다.
      # 그 버전들이 새 버전으로 넘어올 수 있도록 당분간 채움 파일을 넣어 크기를 맞춘다. (모든 기기가 v22 이상이 되면 이 단계를 지운다)
      - name: Pad APK for old updaters
        run: head -c 420000 /dev/urandom > app/src/main/assets/pad.bin

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: carAssistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk carAssistant.apk
          cp app/src/main/assets/index.html index.html
          NATIVE=$(tr -d '[:space:]' < native-version.txt)
          MINNATIVE=$(grep -o 'name="min-native" content="[0-9]*"' index.html | grep -o '[0-9]*' | head -1)
          # 서명 키가 없는 빌드는 APK 업데이트를 알리지 않는다(native=0). 화면 업데이트만 나간다.
          if [ "$SIGNED" != "true" ]; then NATIVE=0; fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          # 통신량을 줄이려고 화면 파일은 압축본도 올리고, 받은 파일이 온전한지 확인할 크기·해시를 함께 적는다.
          gzip -9 -k -n index.html
          APKSIZE=$(stat -c %s carAssistant.apk)
          APKSHA=$(sha256sum carAssistant.apk | cut -d' ' -f1)
          UISHA=$(sha256sum index.html | cut -d' ' -f1)
          printf '{"native":%s,"ui":%s,"minNative":%s,"apkUrl":"%s/carAssistant.apk","apkSize":%s,"apkSha":"%s","uiUrl":"%s/index.html","uiGzUrl":"%s/index.html.gz","uiSha":"%s"}\n' \
            "$NATIVE" "${{ github.run_number }}" "${MINNATIVE:-1}" "$BASE" "$APKSIZE" "$APKSHA" "$BASE" "$BASE" "$UISHA" > version.json
          cat version.json
          ls -l carAssistant.apk index.html index.html.gz
          gh release delete latest --cleanup-tag -y || true
          gh release create latest carAssistant.apk index.html index.html.gz version.json \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "carAssistant 최신 빌드" \
            --notes "자동 빌드 (commit ${GITHUB_SHA::7}, build ${{ github.run_number }}, 서명 키 사용: ${SIGNED})"
